name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('tag does not match package version')"
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run package:smoke
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: briefwright-*.tgz
      - name: Publish to npm
        if: vars.PUBLISH_NPM == 'true'
        run: npm publish briefwright-*.tgz --provenance --access public
      - name: Create GitHub release
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" briefwright-*.tgz --generate-notes --verify-tag "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
