interface:
  display_name: "Briefwright"
  short_description: "Build auditable briefings in ordinary language"
  default_prompt: "Use $briefwright as my conversational briefing assistant. Detect or offer to install Briefwright, ask one simple question at a time, let me choose any supported model, recommend Feishu plus Obsidian while keeping SQLite and a local folder as clear fallbacks, and hide CLI and YAML unless I ask. Start with a safe preview, explain readiness and failures plainly, and require explicit confirmation before schedules, remote writes, policy or cadence changes. For knowledge intake, keep generic feedback separate from the durable selection receipt, preserve one idempotent request ID across retries or context compression, recover phase from readback, and require a distinct proposal-bound confirmation before the only target write."
